name : Publish image to Docker Hub
on:
  [workflow_dispatch]

jobs:
  publish_image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - nane: build
        run: |
          docker build . -t hocker00/entrypoint:latest
      - name: publish
        run: |
          docker push hocker00/entrypoint:latest